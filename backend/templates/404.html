{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Page Not Found</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#0b1220; color:#fff; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { width:min(900px, 92vw); background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:22px; box-shadow: 0 12px 50px rgba(0,0,0,.45); text-align:center; }
    img { width: min(720px, 100%); border-radius:14px; display:block; margin:0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 18px; opacity:.85; }
    a.btn { display:inline-block; padding:12px 18px; border-radius:12px; background:#2563eb; color:white; text-decoration:none; font-weight:600; }
    a.btn:hover { background:#1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'images/404.png' %}" alt="404">
    <h1>404 — Page Not Found</h1>
    <p>The page you’re looking for doesn’t exist.</p>
    <a class="btn" href="/admin/login/">Go to Admin Login</a>
  </div>
</body>
</html>
